start_cooking:
  name: Start Cooking
  description: Start a cooking program on the Chunmi electric pressure cooker.
  fields:
    mode:
      name: Cooking Mode
      description: Preset mode slug or Chinese name (e.g., white_rice, soup, 大米饭, 煲汤).
      example: white_rice
      selector:
        text:
    taste:
      name: Taste Preference
      description: Taste selection (0 or soft_glutinous/软糯, 1 or standard/适中, 2 or chewy/嚼劲).
      example: standard
      selector:
        text:
    duration:
      name: Holding Duration (Minutes)
      description: Custom holding pressure duration in minutes (usually between 5~60 min).
      example: 20
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
    cook_code:
      name: Custom Heating Profile Code
      description: Custom 358-character Hex heating profile.
      example: "020104..."
      selector:
        text:
    name:
      name: Recipe Display Name
      description: Custom name to display on cooker screen (up to 7 characters).
      example: White Rice
      selector:
        text:

cancel_cooking:
  name: Stop Cooking
  description: Cancel the current cooking program or keep-warm mode.
